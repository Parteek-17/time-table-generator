[project]
name = "slotwise-solver"
version = "0.0.0"
description = "Stateless timetable and exam-seating solver (OR-Tools CP-SAT arrives in Phase 2)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.156.8",
    "jsonschema==4.26.0",
    "ortools==9.15.6755",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slotwise_solver"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
