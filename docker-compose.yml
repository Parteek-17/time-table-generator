# Local infrastructure for development. Start with: docker compose up -d
name: slotwise

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      # "slotwise" is the owner/superuser used only by migrations and the seed.
      POSTGRES_USER: slotwise
      POSTGRES_PASSWORD: slotwise
      POSTGRES_DB: slotwise
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the restricted "slotwise_app" login on first start.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slotwise -d slotwise']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Catches every email sent locally. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - '1025:1025'
      - '8025:8025'

  # S3-compatible storage for imports and generated PDFs (API: S3_* in apps/api/.env).
  # RustFS, because MinIO no longer publishes pullable images. API http://localhost:9000,
  # console http://localhost:9001 (login slotwise / slotwise-dev-storage). The app creates
  # its bucket on first use. Dev only: single disk, runs as root to own the named volume.
  storage:
    image: rustfs/rustfs:1.0.0
    user: '0:0'
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: slotwise
      RUSTFS_SECRET_KEY: slotwise-dev-storage
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: 'true'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage:/data

volumes:
  pgdata:
  storage:
